name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, and the smallest config that shows it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag or commit, e.g. v0.10.0.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [Docker Compose, Helm chart, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Startup log
      description: The `Configuration:` and `Feature flags:` lines help. Redact secrets.
      render: text
