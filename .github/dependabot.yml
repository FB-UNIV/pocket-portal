version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Keep Node's types on the runtime's major (the image and CI run the
      # current LTS), so code can't typecheck against APIs the runtime lacks.
      # Moves together with the Docker `node` major below.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Stay on the current Node LTS. Odd majors are never LTS, and moving
      # to the next LTS is a deliberate change, not a weekly bump.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
