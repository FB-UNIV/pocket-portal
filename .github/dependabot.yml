version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Keep Node's types on the runtime's major (the image and CI run the
      # current LTS), so code can't typecheck against APIs the runtime lacks.
      # Moves together with the Docker `node` major below.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @opentelemetry/resources@2.12.0 (pulled in by @vercel/otel and
      # sdk-logs) peers on "@opentelemetry/api" ">=1.3.0 <1.10.0", so 1.10
      # makes `npm ci` fail with ERESOLVE. Drop this once a resources
      # release accepts api 1.10.
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      # The OpenTelemetry JS 0.300 line (instrumentation 0.301, sdk-logs 3.0)
      # peers on api 1.10 (held back above), and @vercel/otel 2.3.0 peers on
      # api-logs, sdk-logs and instrumentation ">=0.200.0 <0.300.0", so
      # either makes `npm ci` fail with ERESOLVE (#43, #78). Drop these once
      # an @vercel/otel release accepts 0.300.
      - dependency-name: "@opentelemetry/instrumentation"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/api-logs"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/sdk-logs"
        versions: [">=0.300.0"]
      # Blocked upstream, tracked in #12 with the conditions to retry:
      # eslint-config-next's react, import and jsx-a11y plugins still peer on
      # eslint ^9, and typescript-eslint on typescript <6.1. Re-check there
      # rather than closing a failing Dependabot PR every week.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Stay on the current Node LTS. Odd majors are never LTS, and moving
      # to the next LTS is a deliberate change, not a weekly bump.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
