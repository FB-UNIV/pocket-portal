name: Changes

# Called by the workflows whose checks are required but not worth running
# on a docs-only PR (e2e, compose, build-check). They used to skip those
# PRs with `paths-ignore`, but then the check never starts and a required
# check waits forever. Now they always run, and their real job skips itself
# on `code == 'false'`: GitHub counts a job skipped by its `if` as passing.

on:
  workflow_call:
    outputs:
      code:
        description: "'false' when a pull request changes only docs; 'true' otherwise (and on any non-PR event)"
        value: ${{ jobs.classify.outputs.code }}

permissions: {}

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The same list the workflows used to paths-ignore. In `case`, `*`
          # matches `/` too, so `*.md` is any Markdown file at any depth.
          # Fetched first, so an API error fails this job (callers then run
          # their job anyway) rather than reading as "no code changed".
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          code=false
          while IFS= read -r file; do
            case "$file" in
              "" | *.md | docs/* | .claude/* | LICENSE) ;;
              *) code=true; echo "Code change: $file"; break ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
