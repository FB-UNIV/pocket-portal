name: SBOM check

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. Only the job that commits the regenerated SBOM on
# main gets write access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests: fail with a pointer if sbom.cdx.json is stale. Never
  # writes; a PR branch may belong to a fork.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run sbom

      - name: Check SBOM is current
        run: |
          if ! git diff --exit-code -- sbom.cdx.json; then
            echo "::error::sbom.cdx.json is out of date. Regenerate it the reproducible way (Node 24 on linux-x64; see docs/CONTRIBUTING.md) and commit it."
            exit 1
          fi

  # main: self-heal by committing CI's own output, since npm sbom's result
  # depends on the installed tree and this is the canonical environment.
  commit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run sbom

      - name: Commit regenerated SBOM
        run: |
          if ! git diff --exit-code -- sbom.cdx.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sbom.cdx.json
            git commit -m "chore: regenerate sbom.cdx.json [skip ci]"
            git push
          fi
