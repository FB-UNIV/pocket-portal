name: SBOM check

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. Only the job that commits the regenerated SBOM on
# main gets write access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests: fail with a pointer if sbom.cdx.json is stale. Never
  # writes; a PR branch may belong to a fork.
  check:
    # The check's name on the PR, and the context branch protection requires.
    name: SBOM up to date
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run sbom

      - name: Check SBOM is current
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- sbom.cdx.json; then
            echo "### SBOM up to date" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error title=SBOM out of date::sbom.cdx.json doesn't match this PR's dependencies. The job summary has the commands to regenerate it."
          {
            echo "### sbom.cdx.json is out of date"
            echo
            echo "This PR changes dependencies (\`package.json\` / \`package-lock.json\`) without regenerating the SBOM."
            if [ "$AUTHOR" = "dependabot[bot]" ]; then
              echo "Dependabot can't do that itself: check out the branch, regenerate, and push."
            fi
            echo
            echo "Regenerate it with **Node 24** from a scratch copy (\`docs/CONTRIBUTING.md\`), so it matches CI:"
            echo
            echo '```bash'
            echo "git switch $BRANCH"
            echo 'd=$(mktemp -d) && mkdir -p "$d/scripts"'
            echo 'cp package.json package-lock.json "$d/" && cp scripts/generate-sbom.mjs "$d/scripts/"'
            echo '(cd "$d" && npm ci --ignore-scripts && node scripts/generate-sbom.mjs)'
            echo 'cp "$d/sbom.cdx.json" . && git commit -am "chore: regenerate sbom.cdx.json" && git push'
            echo '```'
            echo
            echo "<details><summary>What changed (component names and versions)</summary>"
            echo
            echo '```diff'
            git diff -U0 -- sbom.cdx.json | grep -E '^[-+] *"(name|version)"' | head -60
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # main: self-heal by committing CI's own output, since npm sbom's result
  # depends on the installed tree and this is the canonical environment.
  commit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run sbom

      - name: Commit regenerated SBOM
        run: |
          if ! git diff --exit-code -- sbom.cdx.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sbom.cdx.json
            git commit -m "chore: regenerate sbom.cdx.json [skip ci]"
            git push
          fi
