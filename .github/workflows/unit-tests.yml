name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Next.js's typed-routes feature (LayoutProps, PageProps, etc.) only
      # exists after this — a fresh checkout has no .next/types yet.
      - run: npx next typegen

      - run: npx tsc --noEmit

      - run: npm run test:coverage

      # Blocking for production dependencies at high severity: that code
      # ships in the image, and advisory-only is how a vulnerable nodemailer
      # reached a release. A new advisory does redden open PRs, which
      # is the point: fix it first.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Advisory for everything else (dev tooling isn't shipped). Dependabot
      # (7-day cooldown) handles the updates.
      - name: Audit all dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
