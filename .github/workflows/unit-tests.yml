name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # The check's name on the PR, and the context branch protection requires.
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - id: install
        name: Install dependencies
        run: npm ci

      - id: lint
        name: Lint
        run: npm run lint

      # Next.js's typed-routes feature (LayoutProps, PageProps, etc.) only
      # exists after this — a fresh checkout has no .next/types yet.
      - id: typegen
        name: Generate route types
        run: npx next typegen

      - id: typecheck
        name: Typecheck
        run: npx tsc --noEmit

      - id: test
        name: Unit tests + coverage
        run: npm run test:coverage

      # Dependency advisories are dependency-audit.yml's job, so that a new
      # CVE fails a check named after it rather than this one.

      - name: Explain the failure
        if: failure()
        env:
          INSTALL: ${{ steps.install.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPEGEN: ${{ steps.typegen.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          {
            echo "### Lint, typecheck & unit tests failed"
            echo
            echo "| Step | Result | Reproduce locally |"
            echo "| --- | --- | --- |"
            echo "| Install | $INSTALL | \`npm ci\` (with Node 24; a lockfile written by another npm can fail here) |"
            echo "| Lint | $LINT | \`npm run lint\` |"
            echo "| Route types | $TYPEGEN | \`npx next typegen\` |"
            echo "| Typecheck | $TYPECHECK | \`npx tsc --noEmit\` |"
            echo "| Unit tests + coverage | $TEST | \`npm run test:coverage\` (coverage thresholds fail the run even when every test passes) |"
            echo
            echo "Open the step marked **failure** in the log for the details."
          } >> "$GITHUB_STEP_SUMMARY"
