name: Docs site

# The docs site (#8): docs/ rendered with VitePress, built on every PR that
# touches it, published to GitHub Pages from main. Its own package
# (docs/package.json), installed without scripts; only the deploy job holds
# Pages write permission, and it runs no dependency code.
on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "README.md", ".github/workflows/docs.yml"]

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # lastUpdated reads git history
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name == 'push'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
