name: Docker build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Every job states what it needs; nothing gets the default token.
permissions: {}

concurrency:
  # A PR: one group, and a newer push cancels the older run. main and tags:
  # one group per commit. GitHub keeps only one *waiting* run per group and
  # cancels the one a newer run replaces, so a single group for main
  # silently dropped queued builds (11 of 14 merges on Nov 13 got no image).
  # Per commit, no push can drop another commit's build, and a release
  # tag's run waits in its commit's group until that commit's build is done.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only PRs skip the job below (they can't break it; unit tests still
  # run and hold the docs' drift checks) without leaving a required check
  # waiting forever, which `paths-ignore` did. See changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      pull-requests: read

  # PR-time correctness check: a broken multi-stage build or `next build`
  # regression used to only surface after landing on main (docker-build ran
  # push-only). No scan, no push — just prove the image still builds.
  build-check:
    # The check's name on the PR, and the context branch protection requires.
    name: Docker image builds
    needs: changes
    # PRs only, and not docs-only ones; also if classifying failed.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build (verify only, no push/load)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every merge to main: build for amd64 and arm64, push by digest, scan,
  # sign, and only then tag `dev-<sha>` (and `dev` if it's still main's
  # newest commit). Never `latest` or a version: those come only from
  # promote-release below, on a release tag.
  # The npm-level SBOM (CycloneDX) for this commit, attested onto its image
  # by `build` below, and attached to the GitHub Release on a tag. A job of its own, holding no write permission: it
  # installs the dependency tree (`--ignore-scripts`, so no package code
  # runs) and only hands the JSON on as an artifact.
  # On a release tag too: github-release attaches it to the release.
  npm-sbom:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run sbom

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-sbom
          path: sbom.cdx.json
          retention-days: 90

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: npm-sbom
    runs-on: ubuntu-latest
    # The arm64 half builds under QEMU: 1 to 21 minutes with a warm cache,
    # but a cold one hit the old 30-minute limit three times (Nov 10 twice,
    # Nov 13), leaving those commits without an image.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing: the signature is tied to this workflow's
      # GitHub OIDC identity, no key to store or leak.
      id-token: write
      # The signed npm SBOM attestation (actions/attest-sbom).
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # arm64 is built under emulation: homelab hardware is often ARM.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/${{ github.repository }} is mixed case; registry paths must
      # be lowercase. metadata-action lowercases its own tags, but anything
      # built by hand below uses this.
      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Only its OCI labels are used (source, revision, version...): the
      # tags are set by hand once the image has been scanned and signed.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,prefix=dev-,format=long,priority=300
            type=raw,value=dev

      # One build, pushed by digest only, with no tag: nothing pullable by
      # name exists until the scan and signature below pass (a failure
      # leaves an untagged digest, never an unscanned `dev-<sha>`). Scanned
      # by that registry digest: a separate `load: true` build can't carry
      # attestations, so its digest never matches what's published.
      - name: Build and push by digest (no tag until scanned)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the pushed image (amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Scan the pushed image (arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Sign the scanned digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      # The npm dependency tree this image was built from, as a signed
      # attestation on its digest (pushed to GHCR beside it, and listed under
      # the repo's Attestations). It follows the digest, so the release tags
      # promote-release adds later carry it too. `sbom: true` above covers
      # the OS packages; this covers npm. Verify with:
      #   gh attestation verify oci://IMAGE@DIGEST --owner OWNER \
      #     --predicate-type https://cyclonedx.org/bom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-sbom

      - name: Attest the npm SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      # Only once scanned, signed and attested: name that exact digest.
      # `dev-<full sha>` always (a short sha can collide, and promote-release
      # looks the image up by it). `dev` only if this commit is still main's
      # newest: builds of different commits run side by side now, and an
      # older one finishing last must not drag `dev` backwards; the newer
      # commit's own build moves it. `imagetools create` only writes a
      # manifest, no rebuild.
      - name: Tag the scanned digest (dev-<sha>, and dev if newest)
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
          SOURCE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          tags=(--tag "$IMAGE:dev-$COMMIT_SHA")
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$COMMIT_SHA" ]; then
            tags+=(--tag "$IMAGE:dev")
          else
            echo "::notice::main has moved on to $head; that commit's build moves dev."
          fi
          docker buildx imagetools create "${tags[@]}" "$SOURCE"

  # A release: `git tag vX.Y.Z && git push origin vX.Y.Z` (see
  # .claude/rules/versioning.md), never an ordinary push to main. No
  # rebuild: it re-scans the tagged commit's `dev-<sha>` image against
  # today's vulnerability database, then tags that same image:
  #   stable vX.Y.Z      -> vX.Y.Z, vX.Y, vX, latest
  #   pre-release        -> only its own tag, e.g. v1.0.0-rc.1
  # Version tags never move to other content: a version is only ever
  # created by its own git tag.
  promote-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # One release at a time, so two can't both decide they're the newest.
    # GitHub keeps only one *waiting* job per group: if a third tag lands
    # meanwhile, the one it replaces is cancelled; re-run it.
    concurrency:
      group: promote-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      latest: ${{ steps.float.outputs.latest }}
    steps:
      # The `v*` trigger also matches e.g. "vfoo": refuse anything that
      # isn't a semver release or pre-release before touching the registry.
      - name: Validate the pushed tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG_NAME' isn't vX.Y.Z or vX.Y.Z-<pre-release>; refusing to promote."
            exit 1
          fi

      # A floating tag moves only if this is the newest stable release in
      # its range: a patch to an older line (v1.4.1 after v2.0.0) must not
      # drag latest, v1 or v1.4 backwards. Pre-releases move none of them.
      - name: Work out which floating tags move
        id: float
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          stable=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          newest() { grep -E "^${1//./\\.}" <<< "$stable" | sort -V | tail -n 1; }
          moves() { [[ "$TAG_NAME" != *-* && "$(newest "$1")" == "$TAG_NAME" ]] && echo true || echo false; }
          major=${TAG_NAME%%.*}   # v1
          minor=${TAG_NAME%.*}    # v1.4
          {
            echo "latest=$(moves v)"
            echo "major=$(moves "$major.")"
            echo "minor=$(moves "$minor.")"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # dev-<sha> is a tag, and a re-run of `build` could move it mid-job:
      # resolve it to one digest here, and check, scan, tag and sign only
      # that. This run waits in its commit's concurrency group while that
      # commit's build runs; if the build failed or never ran, there's
      # nothing to find and this fails loudly.
      - name: Resolve the commit's image to a digest
        id: src
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:dev-$COMMIT_SHA" --format '{{printf "%s" .Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

      # A tag is a claim, so check it before acting on it: the commit must
      # be on main, its package.json must be this version, and the image
      # must carry the signature main's own build of *that commit* made
      # (this workflow, on refs/heads/main, triggered by a push, at that
      # sha). Anything else pushed under `dev-<sha>` is refused.
      - name: Check the tag names a release of main, built by main's pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ steps.src.outputs.ref }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT_SHA...main" --jq .status)
          if [ "$status" != identical ] && [ "$status" != ahead ]; then
            echo "::error::$TAG_NAME is on $COMMIT_SHA, which isn't on main ($status); not releasing it."
            exit 1
          fi
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$COMMIT_SHA" --jq .content | base64 -d | jq -r .version)
          if [ "v$version" != "$TAG_NAME" ]; then
            echo "::error::package.json at $COMMIT_SHA says $version, not ${TAG_NAME#v}; not releasing it."
            exit 1
          fi
          cosign verify "$REF" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/docker-build.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-trigger push \
            --certificate-github-workflow-sha "$COMMIT_SHA" > /dev/null

      # Re-scanned against today's vulnerability database: the build's own
      # scan may be weeks old by release time.
      - name: Scan the commit's image (amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ steps.src.outputs.ref }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Scan the commit's image (arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.src.outputs.ref }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      # {{raw}} keeps the git tag as is (v1.2.3). vX.Y, vX and latest are
      # switched on or off explicitly (see above), rather than trusting
      # metadata-action's own pre-release handling.
      - name: Work out the release tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ steps.float.outputs.minor }}
            type=semver,pattern=v{{major}},enable=${{ steps.float.outputs.major }}
            type=raw,value=latest,enable=${{ steps.float.outputs.latest }}

      - name: Tag the scanned image as the release
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: ${{ steps.src.outputs.ref }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tag_args[@]}" "$SOURCE"

      # Only if the release tag landed on the scanned digest: signing
      # anything else would vouch for an image this job never checked.
      - name: Sign the release
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG_NAME: ${{ github.ref_name }}
          SCANNED: ${{ steps.src.outputs.digest }}
        run: |
          tagged=$(docker buildx imagetools inspect "$IMAGE:$TAG_NAME" --format '{{printf "%s" .Manifest.Digest}}')
          if [ "$tagged" != "$SCANNED" ]; then
            echo "::error::$TAG_NAME points at $tagged, not the scanned $SCANNED; not signing."
            exit 1
          fi
          cosign sign --yes "$IMAGE@$SCANNED"

  # The GitHub Release, once the image is promoted: notes from the
  # version's CHANGELOG.md section, the npm SBOM attached while it's still a
  # draft, then published. Immutable releases lock a published release's
  # assets, hence draft first. Write access, but no dependency code runs:
  # it reads CHANGELOG.md and uploads a file built by npm-sbom.
  github-release:
    needs: [promote-release, npm-sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-sbom

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          LATEST: ${{ needs.promote-release.outputs.latest }}
        run: |
          version=${TAG_NAME#v}
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version; add one, then re-run this job."
            exit 1
          fi
          flags=(--latest="$LATEST")
          [[ "$TAG_NAME" == *-* ]] && flags+=(--prerelease)
          # A re-run finds the draft it left, or a release already out.
          if draft=$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = false ]; then
              echo "::notice::$TAG_NAME is already published."
              exit 0
            fi
          else
            gh release create "$TAG_NAME" --draft --verify-tag --title "$TAG_NAME" --notes-file notes.md "${flags[@]}"
          fi
          gh release upload "$TAG_NAME" sbom.cdx.json --clobber
          gh release edit "$TAG_NAME" --draft=false "${flags[@]}"
          echo "### Released [$TAG_NAME]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG_NAME)" >> "$GITHUB_STEP_SUMMARY"
