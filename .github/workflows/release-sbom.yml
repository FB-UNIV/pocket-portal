name: Release SBOM

# Attaches the npm SBOM (CycloneDX) to a GitHub Release, for anyone who
# wants it without registry tooling. The signed copy is the attestation on
# the image (docker-build.yml); this is the same file, generated from the
# release tag's lockfile.

on:
  release:
    types: [published]
  # Backfill a release published before this workflow existed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.1"
        required: true

permissions: {}

jobs:
  # Read-only: installs the tree (no install scripts) and generates the file.
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - run: npm run sbom

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sbom
          path: sbom.cdx.json
          retention-days: 7

  # Write access, but runs no dependency code: it only uploads the file.
  upload:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" sbom.cdx.json --clobber --repo "$REPO"
          echo "### SBOM attached to [$TAG](https://github.com/$REPO/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
